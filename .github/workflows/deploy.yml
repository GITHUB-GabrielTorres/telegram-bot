name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/31370336992/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: telegram-bot-deployer-sa@telegram-bot-estalecas.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy telegram-bot \
            --source . \
            --region us-central1 \
            --project telegram-bot-estalecas